# Configuración del Worker. Aquí NO van secretos: se cargan con `wrangler secret put`
# (producción) o en apps/api/.dev.vars (local). Ver README.
name = "marlon"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# La PWA compilada se sirve desde el mismo Worker (mismo origen que la API).
# La base de conocimiento (apps/api/knowledge/*.md) se empaqueta como texto.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "marlon"
# Id de la base de datos D1 (no es un secreto: solo identifica la base de datos).
database_id = "1c613b41-5187-459b-b17c-f018b7bff785"
migrations_dir = "migrations"

[triggers]
# Cada 5 min: Google Calendar y notificaciones. Cada 3 h (minuto 7): calendario de la uni.
crons = ["*/5 * * * *", "7 */3 * * *"]

[vars]
LLM_PROVIDER = "openai-compatible"
LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
# Flash-Lite: el más barato y el que menos se satura. Para respuestas algo mejores
# (y más caras) usa "gemini-flash-latest". Consulta modelos y cuotas en AI Studio.
LLM_MODEL = "gemini-flash-lite-latest"
# Si el principal está saturado, se prueba este.
LLM_FALLBACK_MODELS = "gemini-flash-latest"

# Despachador preciso de avisos (alarmas de Durable Object, plan gratuito con SQLite).
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "NotificationScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotificationScheduler"]
